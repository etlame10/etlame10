<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulador de detectores de humo</title>
  <meta name="description" content="Simulador interactivo para ver cómo detecta el humo cada tipo de detector.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23e8edf2' stroke='%2322303d' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ff4d4d'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip" href="#view">Saltar al contenido</a>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13"/><circle cx="16" cy="16" r="7" class="ring"/><circle cx="16" cy="16" r="2.6" class="dot"/></svg>
      <span>Detectores de humo<small>Simulador</small></span>
    </div>
    <div class="topbar-actions">
      <button id="present-btn" class="icon-btn" aria-pressed="false" title="Modo presentación (pantalla completa, letra grande)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M12 16v4M8 20h8"/></svg>
        <span class="sr-only">Modo presentación</span>
      </button>
      <button id="sound-btn" class="icon-btn" aria-pressed="false" title="Sonido (desactivado)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="sound-on" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/><path class="sound-off" d="M16 9l5 6M21 9l-5 6"/></svg>
        <span class="sr-only">Sonido</span>
      </button>
      <button id="theme-btn" class="icon-btn" title="Cambiar tema claro/oscuro">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
        <span class="sr-only">Cambiar tema</span>
      </button>
    </div>
  </header>
  <main id="view" class="view" tabindex="-1"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Esta aplicación necesita JavaScript activado.</p></noscript>
  <script src="js/core.js"></script>
  <script src="js/data/sources.js"></script>
  <script src="js/data/technologies.js"></script>
  <script src="js/art.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/modules/tech.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
