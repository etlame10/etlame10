<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulador de detectores de humo</title>
  <meta name="description" content="Simulador interactivo para ver cómo detecta el humo cada tipo de detector.">
  <style>
/* =========================================================
   Detectores de humo · Laboratorio interactivo
   Tema: laboratorio técnico. Oscuro por defecto según sistema,
   claro de alto contraste disponible.
   ========================================================= */
:root {
  --bg: #f3f5f7;
  --bg-2: #e8ecf0;
  --panel: #ffffff;
  --panel-2: #f7f9fb;
  --line: #d3dae1;
  --line-2: #b9c3cd;
  --text: #121a22;
  --muted: #4c5b69;
  --accent: #0a6fb8;
  --accent-ink: #ffffff;
  --accent-soft: #dcecf8;
  --ok: #107a3e;
  --ok-soft: #dcf2e4;
  --warn: #9a5a00;
  --warn-soft: #fbecd2;
  --bad: #c0262d;
  --bad-soft: #fbe0e1;
  --violet: #6a3fb5;
  --violet-soft: #ece4fa;
  --svg-bg: #eef2f5;
  --svg-stroke: #2a3946;
  --svg-fill: #dfe5ea;
  --svg-dark: #33404c;
  --light-ray: #d9480f;
  --led-off: #6f7a84;
  --smoke-lenta: #7d8790;
  --smoke-llama: #3b4047;
  --smoke-vapor: #6aa9d6;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(16, 24, 32, .06), 0 4px 16px rgba(16, 24, 32, .05);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1117; --bg-2: #111821; --panel: #141c25; --panel-2: #18222d;
    --line: #253240; --line-2: #34465a; --text: #e6edf3; --muted: #9aabbb;
    --accent: #3fa7f5; --accent-ink: #05131f; --accent-soft: #10283b;
    --ok: #3ccf7a; --ok-soft: #0f2a1b; --warn: #f0a63a; --warn-soft: #2d2110;
    --bad: #ff5c63; --bad-soft: #321417; --violet: #b394ff; --violet-soft: #231a38;
    --svg-bg: #0f161e; --svg-stroke: #9fb3c6; --svg-fill: #1e2a36; --svg-dark: #0a0f14;
    --light-ray: #ff8a3d; --led-off: #3b4652;
    --smoke-lenta: #a9b2bb; --smoke-llama: #737a82; --smoke-vapor: #8ccaf2;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1117; --bg-2: #111821; --panel: #141c25; --panel-2: #18222d;
  --line: #253240; --line-2: #34465a; --text: #e6edf3; --muted: #9aabbb;
  --accent: #3fa7f5; --accent-ink: #05131f; --accent-soft: #10283b;
  --ok: #3ccf7a; --ok-soft: #0f2a1b; --warn: #f0a63a; --warn-soft: #2d2110;
  --bad: #ff5c63; --bad-soft: #321417; --violet: #b394ff; --violet-soft: #231a38;
  --svg-bg: #0f161e; --svg-stroke: #9fb3c6; --svg-fill: #1e2a36; --svg-dark: #0a0f14;
  --light-ray: #ff8a3d; --led-off: #3b4652;
    --smoke-lenta: #a9b2bb; --smoke-llama: #737a82; --smoke-vapor: #8ccaf2;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.55 var(--font);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: var(--accent); }
h1, h2, h3, h4 { line-height: 1.2; margin: 0 0 .5em; letter-spacing: -.01em; }
h1 { font-size: clamp(1.6rem, 3vw, 2.2rem); }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.08rem; }
p { margin: 0 0 .8em; }
ul { margin: 0 0 .8em; padding-left: 1.2em; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 31; background: var(--panel); }
.skip { position: absolute; left: -999px; top: 8px; background: var(--accent); color: var(--accent-ink); padding: 8px 12px; z-index: 100; border-radius: 6px; }
.skip:focus { left: 8px; }
.noscript { padding: 20px; }

/* ---------- Componentes base ---------- */
.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px; box-shadow: var(--shadow);
}
.panel + .panel { margin-top: 16px; }
.panel-title { display: flex; align-items: center; gap: 8px; justify-content: space-between; flex-wrap: wrap; margin-bottom: 10px; }
.panel-title h2, .panel-title h3 { margin: 0; }
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1050px) { .split { grid-template-columns: minmax(0, 1fr); } .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr); } }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.stack > * + * { margin-top: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 8px 14px; border-radius: 9px;
  border: 1px solid var(--line-2); background: var(--panel-2); color: var(--text);
  cursor: pointer; text-decoration: none; font-weight: 600; font-size: .92rem;
}
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-danger { border-color: var(--bad); color: var(--bad); }
.btn-ghost { background: transparent; }

.seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.seg button, .chip {
  min-height: 38px; padding: 6px 12px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line-2); background: var(--panel); font-size: .9rem;
}
.seg button[aria-pressed="true"], .chip[aria-pressed="true"] {
  background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600;
}
.seg button:hover, .chip:hover { border-color: var(--accent); }

.tag {
  display: inline-block; padding: 2px 8px; border-radius: 999px; font: 600 .72rem var(--mono);
  letter-spacing: .02em; border: 1px solid transparent; white-space: nowrap;
}
.tag-general { background: var(--ok-soft); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.tag-model { background: var(--warn-soft); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.tag-some { background: var(--violet-soft); color: var(--violet); border-color: color-mix(in srgb, var(--violet) 40%, transparent); }
.tag-didactic { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }

.notice {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 10px 12px; border-radius: 10px; font-size: .88rem;
  background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
}
.notice::before { content: "!"; flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--warn); color: var(--panel); font-weight: 800; font-size: .8rem; }
.notice.info { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.notice.info::before { content: "i"; background: var(--accent); }

.refs { margin-top: 12px; font-size: .84rem; border-top: 1px dashed var(--line); padding-top: 10px; }
.refs summary { cursor: pointer; }
.refs-title { font-weight: 700; color: var(--muted); }
.refs ul { margin: 8px 0 0; }
.refs li { margin-bottom: 6px; }
.refs-meta { color: var(--muted); }
.refs-empty { display: flex; gap: 8px; flex-wrap: wrap; color: var(--muted); }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0;
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px;
  transition: all .2s ease; pointer-events: none; z-index: 60; font-size: .9rem; max-width: calc(100vw - 32px);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Estado / medidores ---------- */
.status {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
  font: 700 .82rem var(--mono); letter-spacing: .04em; text-transform: uppercase;
  border: 1px solid var(--line-2); background: var(--panel-2);
}
.status::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.status[data-level="rise"]::before { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 25%, transparent); }
.status[data-level="alarm"] { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.status[data-level="alarm"]::before { background: var(--bad); animation: pulse .6s infinite alternate; }
.status[data-level="fault"] { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.status[data-level="fault"]::before { background: var(--warn); animation: pulse 1s infinite alternate; }
.status[data-level="test"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.status[data-level="test"]::before { background: var(--accent); }
@keyframes pulse { from { opacity: 1; } to { opacity: .25; } }

.meter { margin-top: 6px; }
.meter-head { display: flex; justify-content: space-between; font-size: .84rem; color: var(--muted); }
.meter-head strong { color: var(--text); font-family: var(--mono); }
.meter-bar { position: relative; height: 14px; border-radius: 7px; background: var(--bg-2); border: 1px solid var(--line); overflow: hidden; }
.meter-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); transition: width .12s linear; }
.meter-fill.alarm { background: var(--bad); }
.meter-thr { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 2px dashed var(--bad); }

.trace { width: 100%; height: 90px; display: block; background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px; }
.trace .grid-line { stroke: var(--line); stroke-width: 1; }
.trace .thr { stroke: var(--bad); stroke-dasharray: 5 4; stroke-width: 1.5; }
.trace .sig { fill: none; stroke: var(--accent); stroke-width: 2; }
.trace .sig2 { fill: none; stroke: var(--warn); stroke-width: 2; }

.control { display: grid; gap: 4px; margin-top: 12px; }
.control label { font-size: .86rem; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.control output { font-family: var(--mono); color: var(--muted); font-weight: 500; }
input[type="range"] { width: 100%; accent-color: var(--accent); min-height: 28px; }

/* ---------- SVG comunes ---------- */
.stage { width: 100%; height: auto; display: block; background: var(--svg-bg); border: 1px solid var(--line); border-radius: 10px; }
.stage .st { stroke: var(--svg-stroke); fill: none; stroke-width: 2; }
.stage .fl { fill: var(--svg-fill); stroke: var(--svg-stroke); stroke-width: 2; }
.stage .dk { fill: var(--svg-dark); stroke: var(--svg-stroke); stroke-width: 1.5; }
.stage .lbl { fill: var(--muted); font: 600 12px var(--font); }
.stage .lbl-strong { fill: var(--text); font: 700 12px var(--font); }
.stage .ray { stroke: var(--light-ray); stroke-width: 2; }
.stage .beam { stroke: var(--light-ray); stroke-width: 6; opacity: .5; stroke-linecap: round; }
.stage .glow { fill: var(--light-ray); }
.stage .ok-fill { fill: var(--ok); }
.stage .bad-fill { fill: var(--bad); }
.stage .acc-st { stroke: var(--accent); }
.stage .pipe { stroke: #c0262d; stroke-width: 10; fill: none; stroke-linecap: round; }
.stage .pipe-in { stroke: color-mix(in srgb, #c0262d 40%, var(--svg-bg)); stroke-width: 5; fill: none; stroke-linecap: round; }
.stage .smoke { pointer-events: none; }
.p-lenta { fill: var(--smoke-lenta); }
.p-llama { fill: var(--smoke-llama); }
.p-vapor { fill: var(--smoke-vapor); }
.p-pipe { fill: var(--smoke-lenta); }
.stage .ion-pos { fill: var(--accent); }
.stage .ion-neg { fill: var(--violet); }
.stage .ion-stuck { fill: var(--led-off); }
.stage .alpha { stroke: var(--warn); stroke-width: 2; stroke-dasharray: 3 4; }
.stage .flame { fill: #ff7a1a; }
.stage .flame-in { fill: #ffd23f; }
.stage .heat-wave { fill: none; stroke: var(--warn); stroke-width: 2; opacity: .7; }
.stage .strat { stroke: var(--violet); stroke-dasharray: 8 6; stroke-width: 2; }
.stage .flow { fill: var(--accent); opacity: .8; }
.stage .logic-on { fill: var(--bad); }
.stage .logic-off { fill: var(--led-off); }
.tasks { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.tasks li { display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 8px; font-size: .9rem; align-items: start; }
.tasks li::before { content: ""; width: 18px; height: 18px; margin-top: 2px; border-radius: 50%; border: 2px solid var(--line-2); }
.tasks li.done::before { background: var(--ok); border-color: var(--ok); box-shadow: inset 0 0 0 3px var(--panel); }
.tasks li.done { color: var(--muted); }
.tasks li .tip { display: block; font-size: .82rem; color: var(--ok); }
.sim-readout { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-top: 10px; }
.caption { font-size: .8rem; color: var(--muted); margin-top: 6px; }

/* ---------- Tecnologías (B) ---------- */
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .facts { grid-template-columns: minmax(0, 1fr); } }
.fact { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--panel-2); }
.fact h4 { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; }
.fact ul { margin: 0; font-size: .9rem; }
.fact.pro h4 { color: var(--ok); }
.fact.con h4 { color: var(--bad); }
.safety { border: 1px solid var(--warn); background: var(--warn-soft); border-radius: 10px; padding: 10px 12px; font-size: .9rem; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }

/* ---------- Estructura de la página ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 clamp(14px, 3vw, 28px);
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; }
.brand-mark { width: 28px; height: 28px; }
.brand-mark circle { fill: var(--svg-fill); stroke: var(--svg-stroke); stroke-width: 2; }
.brand-mark .ring { fill: none; stroke-dasharray: 3 3; }
.brand-mark .dot { fill: var(--bad); stroke: none; }
.brand small { color: var(--muted); font-weight: 500; margin-left: 4px; }
.topbar-actions { margin-left: auto; display: flex; gap: 6px; }
.icon-btn { width: 38px; height: 38px; display: inline-grid; place-items: center; background: transparent; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.icon-btn:hover { background: var(--panel-2); }
.icon-btn svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#sound-btn .sound-on { display: none; }
#sound-btn[aria-pressed="true"] .sound-on { display: inline; }
#sound-btn[aria-pressed="true"] .sound-off { display: none; }

.view { outline: none; padding-bottom: 40px; }
.tabs-bar { position: sticky; top: calc(56px + env(safe-area-inset-top, 0px)); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.tech-tabs { display: flex; gap: 4px; overflow-x: auto; padding: 8px clamp(14px, 3vw, 28px); max-width: 1240px; margin: 0 auto; scrollbar-width: none; }
.tech-tabs::-webkit-scrollbar { display: none; }
.tech-tabs button {
  flex: none; padding: 8px 16px; border-radius: 999px; border: 1px solid transparent; background: transparent;
  cursor: pointer; font-weight: 600; color: var(--muted); white-space: nowrap;
}
.tech-tabs button:hover { color: var(--text); background: var(--panel-2); }
.tech-tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 20px clamp(14px, 3vw, 28px) 0; }
.sim-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
.ctl-panel { position: sticky; top: 124px; }
@media (max-width: 960px) { .sim-grid { grid-template-columns: minmax(0, 1fr); } .ctl-panel { position: static; } }
.stage-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.stage-head h1 { margin: 0; font-size: 1.5rem; }
.ctl-panel h2 { font-size: 1.1rem; }
.ctl-panel hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
.info-panel { margin-top: 16px; }
.info-panel > summary { cursor: pointer; display: flex; align-items: center; gap: 10px; list-style: none; }
.info-panel > summary::-webkit-details-marker { display: none; }
.info-panel > summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
.info-panel[open] > summary::before { transform: rotate(90deg); }
.info-panel h2 { margin: 0; font-size: 1.15rem; }
.foot { max-width: 1240px; margin: 20px auto 0; padding: 0 clamp(14px, 3vw, 28px); font-size: .82rem; color: var(--muted); }
.sim-grid > .panel + .panel { margin-top: 0; }

/* ---------- Alarma visible ---------- */
.stage-wrap { position: relative; }
.stage-panel { transition: border-color .2s, box-shadow .2s; }
.stage-panel[data-state="alarm"] { border-color: var(--bad); animation: alarm-pulse 1s ease-in-out infinite; }
.stage-panel[data-state="fault"] { border-color: var(--warn); }
@keyframes alarm-pulse {
  0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--bad) 0%, transparent); }
  50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--bad) 35%, transparent); }
}
.stage-wrap::after { content: ""; position: absolute; inset: 0; border-radius: 10px; pointer-events: none; opacity: 0; transition: opacity .2s; box-shadow: inset 0 0 0 3px var(--bad), inset 0 0 60px color-mix(in srgb, var(--bad) 45%, transparent); }
.stage-panel[data-state="alarm"] .stage-wrap::after { opacity: 1; animation: flag-blink 1s steps(2, start) infinite; }
.stage-panel[data-state="fault"] .stage-wrap::after { opacity: 1; box-shadow: inset 0 0 0 3px var(--warn); }
.stage-head .status[data-level="alarm"] { font-size: 1rem; padding: 6px 14px; background: var(--bad); color: #fff; border-color: var(--bad); animation: flag-blink 1s steps(2, start) infinite; }
.stage-head .status[data-level="alarm"]::before { background: #fff; }
@keyframes flag-blink { to { opacity: .45; } }
@media (prefers-reduced-motion: reduce) {
  .stage-panel[data-state="alarm"], .stage-panel[data-state="alarm"] .stage-wrap::after, .stage-head .status[data-level="alarm"] { animation: none; }
}
.btn-fire { background: color-mix(in srgb, var(--warn) 16%, var(--panel)); border-color: var(--warn); }

/* ---------- Demostración ---------- */
.demo-box {
  margin-top: 10px; background: var(--accent-soft);
  border: 1px solid var(--accent); border-radius: 12px; padding: 10px 14px 0; overflow: hidden;
}
.demo-box[hidden] { display: none; }
.demo-top { display: flex; align-items: center; gap: 10px; font-size: .85rem; }
.demo-top strong { color: var(--accent); text-transform: uppercase; letter-spacing: .06em; font-size: .78rem; }
.demo-count { color: var(--muted); font-family: var(--mono); }
.demo-nav { margin-left: auto; display: flex; gap: 4px; }
.demo-btn { min-width: 34px; height: 30px; border: 1px solid var(--line-2); background: var(--panel); border-radius: 8px; cursor: pointer; font-size: .8rem; }
.demo-btn:hover { background: var(--panel-2); }
.demo-text { margin: 6px 0 10px; font-size: 1.02rem; font-weight: 500; line-height: 1.4; }
.demo-progress { height: 3px; margin: 0 -14px; background: var(--line); }
.demo-progress i { display: block; height: 100%; width: 0; background: var(--accent); }
.demo-count { white-space: nowrap; }
@media (max-width: 640px) {
  .demo-text { font-size: .95rem; }
  .brand small { display: none; }
  .demo-top strong { display: none; }
}

/* ---------- Modo presentación ---------- */
body.present { font-size: 18px; }
body.present .info-panel, body.present .foot, body.present .ctl-panel hr,

  <script>/* js/core.js */
/*
 * Núcleo de la aplicación: espacio de nombres, utilidades DOM/SVG,
 * almacenamiento seguro, referencias y enrutador por hash.
 * Se usan scripts clásicos (no módulos ES) para que la app funcione
 * también abriendo index.html directamente, sin servidor.
 */
window.APP = window.APP || {};
APP.data = APP.data || {};
APP.modules = APP.modules || {};

(function () {
  "use strict";
  var SVGNS = "http://www.w3.org/2000/svg";

  /* Crea un elemento HTML: h("div", {class: "x", onclick: fn}, [hijos]) */
  function h(tag, attrs, children) {
    var el = document.createElement(tag);
    applyAttrs(el, attrs);
    append(el, children);
    return el;
  }

  /* Igual que h() pero en el espacio de nombres SVG */
  function s(tag, attrs, children) {
    var el = document.createElementNS(SVGNS, tag);
    applyAttrs(el, attrs, true);
    append(el, children);
    return el;
  }

  function applyAttrs(el, attrs, isSvg) {
    if (!attrs) return;
    Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === undefined || v === null || v === false) return;
      if (k.indexOf("on") === 0 && typeof v === "function") {
        el.addEventListener(k.slice(2), v);
      } else if (k === "text") {
        el.textContent = v;
      } else if (k === "html") {
        el.innerHTML = v;
      } else if (k === "class" && !isSvg) {
        el.className = v;
      } else {
        el.setAttribute(k, v === true ? "" : v);
      }
    });
  }

  function append(el, children) {
    if (children === undefined || children === null) return;
    if (!Array.isArray(children)) children = [children];
    children.forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      el.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);
    });
  }

  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function rand(min, max) { return min + Math.random() * (max - min); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  /* localStorage puede fallar (modo privado, file://): nunca debe romper la app */
  var store = {
    get: function (key, fallback) {
      try {
        var raw = window.localStorage.getItem("dh:" + key);
        return raw === null ? fallback : JSON.parse(raw);
      } catch (e) { return fallback; }
    },
    set: function (key, value) {
      try { window.localStorage.setItem("dh:" + key, JSON.stringify(value)); } catch (e) { /* sin persistencia */ }
    },
    remove: function (key) {
      try { window.localStorage.removeItem("dh:" + key); } catch (e) { /* nada */ }
    }
  };

  /* Progreso: qué módulos se han visitado y mejores puntuaciones */
  var progress = {
    visit: function (id) {
      var v = store.get("visited", {});
      v[id] = true;
      store.set("visited", v);
    },
    visited: function () { return store.get("visited", {}); },
    best: function (game) { return store.get("best:" + game, null); },
    saveBest: function (game, score, total) {
      var prev = store.get("best:" + game, null);
      if (!prev || score / total > prev.score / prev.total) {
        store.set("best:" + game, { score: score, total: total });
        return true;
      }
      return false;
    },
    reset: function () {
      store.remove("visited");
      ["quiz", "match", "identify", "cases", "final", "sim"].forEach(function (g) { store.remove("best:" + g); });
    }
  };

  /* Bloque de referencias visibles para una lista de ids de fuentes */
  function sourcesBlock(ids, title) {
    var list = (ids || []).map(function (id) { return APP.data.sources[id]; }).filter(Boolean);
    if (!list.length) {
      return h("div", { class: "refs refs-empty" }, [
        h("span", { class: "refs-title", text: title || "Fuentes" }),
        h("span", { text: "Sin referencia verificada en esta versión: contenido de carácter general." })
      ]);
    }
    return h("details", { class: "refs" }, [
      h("summary", { class: "refs-title", text: (title || "Fuentes") + " (" + list.length + ")" }),
      h("ul", null, list.map(function (src) {
        return h("li", null, [
          h("a", { href: src.url, target: "_blank", rel: "noopener", text: src.title }),
          h("span", { class: "refs-meta", text: " — " + src.publisher + ". " + src.access })
        ]);
      }))
    ]);
  }

  /* Etiqueta de alcance de la información */
  var SCOPE = {
    general: { label: "General", cls: "tag-general", tip: "Válido para la mayoría de detectores de este tipo" },
    modelo: { label: "Según modelo", cls: "tag-model", tip: "Varía según el fabricante: consulta su manual" },
    algunos: { label: "Solo algunos tipos", cls: "tag-some", tip: "No está presente en todos los detectores" },
    didactico: { label: "Representación didáctica", cls: "tag-didactic", tip: "Simplificación para aprender, no un dato real" }
  };
  function scopeTag(kind) {
    var d = SCOPE[kind] || SCOPE.general;
    return h("span", { class: "tag " + d.cls, title: d.tip, text: d.label });
  }

  function techById(id) {
    return APP.data.technologies.filter(function (t) { return t.id === id; })[0];
  }

  /* Aviso breve en pantalla */
  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById("toast");
    if (!el) return;
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2600);
  }

  /* -------- Enrutador --------
   * Cada módulo registra { id, title, render(container), destroy() }.
   * destroy() detiene animaciones y temporizadores al salir.
   */
  var current = null;
  function route() {
    var mod = APP.modules.tech;
    var view = document.getElementById("view");
    if (current && current.destroy) {
      try { current.destroy(); } catch (e) { console.error(e); }
    }
    clear(view);
    current = mod;
    try {
      mod.render(view);
    } catch (e) {
      console.error(e);
      view.appendChild(h("div", { class: "panel error-panel" }, [
        h("h2", { text: "Algo ha fallado al cargar este módulo" }),
        h("p", { text: String(e && e.message ? e.message : e) }),
        h("button", { class: "btn", text: "Recargar", onclick: function () { location.reload(); } })
      ]));
    }
    view.focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }

  /* Gestión de animaciones: un único bucle por vista */
  function loop(fn) {
    var running = true, last = performance.now(), raf = 0;
    function frame(t) {
      if (!running) return;
      var dt = Math.min(0.05, (t - last) / 1000);
      last = t;
      try { fn(dt, t); } catch (e) { running = false; console.error(e); return; }
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    return {
      stop: function () { running = false; cancelAnimationFrame(raf); },
      get running() { return running; }
    };
  }

  /* Pitido opcional con Web Audio (desactivado por defecto) */
  var audioCtx = null;
  function beep(freq, ms) {
    if (!store.get("sound", false)) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "square"; o.frequency.value = freq || 3100;
      g.gain.value = 0.03;
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + (ms || 120) / 1000);
    } catch (e) { /* audio no disponible */ }
  }

  APP.util = { h: h, s: s, clear: clear, shuffle: shuffle, rand: rand, clamp: clamp, loop: loop, beep: beep, toast: toast };
  APP.store = store;
  APP.progress = progress;
  APP.sourcesBlock = sourcesBlock;
  APP.scopeTag = scopeTag;
  APP.techById = techById;
  APP.route = route;
  APP.register = function (mod) { APP.modules[mod.id] = mod; };
})();

</script>

  <script>/* js/art.js */
/*
 * Ilustraciones SVG esquemáticas y widgets de medida reutilizables.
 * Todas son dibujos propios simplificados, no fotos de productos.
 */
(function () {
  "use strict";
  var s = APP.util.s, h = APP.util.h;

  /* ---------- Widgets ---------- */

  /* Barra de medida con umbral. invert: la alarma ocurre por debajo del umbral */
  function meter(label, unit) {
    var fill = h("div", { class: "meter-fill" });
    var thr = h("div", { class: "meter-thr" });
    var val = h("strong", { text: "0" });
    var el = h("div", { class: "meter" }, [
      h("div", { class: "meter-head" }, [h("span", { text: label }), val]),
      h("div", { class: "meter-bar", role: "meter", "aria-label": label, "aria-valuemin": "0", "aria-valuemax": "100" }, [fill, thr])
    ]);
    return {
      el: el,
      set: function (v, threshold, alarm) {
        fill.style.width = APP.util.clamp(v, 0, 100) + "%";
        fill.classList.toggle("alarm", !!alarm);
        thr.style.left = APP.util.clamp(threshold, 0, 100) + "%";
        val.textContent = Math.round(v) + (unit || "");
        el.querySelector(".meter-bar").setAttribute("aria-valuenow", String(Math.round(v)));
      }
    };
  }

  /* Gráfica temporal de la señal (osciloscopio sencillo) */
  function trace(n) {
    var W = 300, H = 90, N = n || 150;
    var svg = s("svg", { class: "trace", viewBox: "0 0 " + W + " " + H, preserveAspectRatio: "none", role: "img", "aria-label": "Evolución de la señal en el tiempo" });
    [0.25, 0.5, 0.75].forEach(function (f) { svg.appendChild(s("line", { class: "grid-line", x1: 0, x2: W, y1: H * f, y2: H * f })); });
    var thr = s("line", { class: "thr", x1: 0, x2: W, y1: 0, y2: 0 });
    var line = s("polyline", { class: "sig", points: "" });
    var line2 = s("polyline", { class: "sig2", points: "" });
    svg.appendChild(thr); svg.appendChild(line); svg.appendChild(line2);
    var data = [], data2 = [];
    function pts(arr) {
      return arr.map(function (v, i) { return (i * W / (N - 1)).toFixed(1) + "," + (H - v / 100 * (H - 4) - 2).toFixed(1); }).join(" ");
    }
    return {
      el: svg,
      push: function (v, threshold, v2) {
        data.push(v); if (data.length > N) data.shift();
        if (v2 !== undefined) { data2.push(v2); if (data2.length > N) data2.shift(); }
        line.setAttribute("points", pts(data));
        line2.setAttribute("points", pts(data2));
        var y = H - threshold / 100 * (H - 4) - 2;
        thr.setAttribute("y1", y); thr.setAttribute("y2", y);
      },
      reset: function () { data = []; data2 = []; line.setAttribute("points", ""); line2.setAttribute("points", ""); }
    };
  }

  /* ---------- Ilustraciones de la galería (viewBox 240x150) ---------- */
  APP.widgets = { meter: meter, trace: trace };
})();

  <script>/* js/scenes.js */
/*
 * Escenas animadas del Módulo B.
 *
 * MODELO DIDÁCTICO: la señal de cada detector se calcula con un modelo
 * sencillo (concentración × factor cualitativo, con retardo y suavizado).
 * Las partículas son la representación visual de ese modelo. Ni los
 * retardos ni las escalas son datos reales de ningún equipo.
 *
 * Cada escena recibe (svg, ctl) y devuelve { step(dt, t) } que devuelve:
 *   detect: 0-100  señal de detección (más alto = más humo percibido)
 *   value:  0-100  magnitud que se muestra en el medidor
 *   invert: true si la alarma ocurre cuando "value" BAJA
 *   label:  nombre de la magnitud del medidor
 *   fault:  true si hay avería
 *   heat:   0-100  (solo escenas con sensor térmico)
 */
(function () {
  "use strict";
  var s = APP.util.s, rand = APP.util.rand, clamp = APP.util.clamp;
  var TYPES = APP.data.smokeTypes;

  /* ---------- utilidades ---------- */
  function Smoke(layer, max) {
    this.layer = layer; this.list = []; this.acc = 0; this.max = max || 170;
  }
  Smoke.prototype.emit = function (rate, dt, make) {
    this.acc += rate * dt;
    while (this.acc >= 1) {
      this.acc -= 1;
      if (this.list.length >= this.max) continue;
      var p = make();
      p.age = 0;
      p.el = s("circle", { r: p.r.toFixed(1), class: "smoke p-" + p.kind, cx: p.x, cy: p.y, opacity: 0 });
      this.layer.appendChild(p.el);
      this.list.push(p);
    }
  };
  Smoke.prototype.update = function (dt, move) {
    for (var i = this.list.length - 1; i >= 0; i--) {
      var p = this.list[i];
      p.age += dt;
      var keep = move(p, dt) !== false && p.age < p.life && p.x > -20 && p.x < 640 && p.y > -20 && p.y < 360;
      if (!keep) {
        p.el.remove();
        this.list.splice(i, 1);
        continue;
      }
      var op = Math.min(1, p.age / 0.4, (p.life - p.age) / 1.2) * (p.alpha || 0.8);
      p.el.setAttribute("cx", p.x.toFixed(1));
      p.el.setAttribute("cy", p.y.toFixed(1));
      p.el.setAttribute("opacity", op.toFixed(2));
    }
  };
  Smoke.prototype.clear = function () {
    this.list.forEach(function (p) { p.el.remove(); });
    this.list = []; this.acc = 0;
  };

  function particle(ctl, x, y, vx, vy, life) {
    var t = TYPES[ctl.type];
    return { x: x, y: y, vx: vx, vy: vy, r: rand(t.size[0], t.size[1]), kind: ctl.type, life: life || 14 };
  }

  /* Línea de retardo: devuelve el valor que tenía la entrada hace "delay" segundos */
  function DelayLine() {
    var buf = [];
    return {
      push: function (t, v) {
        buf.push([t, v]);
        while (buf.length > 2 && buf[1][0] < t - 40) buf.shift();
      },
      get: function (t, delay) {
        var target = t - delay, out = 0;
        for (var i = 0; i < buf.length && buf[i][0] <= target; i++) out = buf[i][1];
        return out;
      },
      reset: function () { buf = []; }
    };
  }

  function ema(cur, target, dt, tau) { return cur + (target - cur) * (1 - Math.exp(-dt / tau)); }
  function noise(amp) { return (Math.random() - 0.5) * amp; }

  function text(x, y, str, cls, anchor) {
    return s("text", { x: x, y: y, class: cls || "lbl", "text-anchor": anchor || "start", text: str });
  }

  /* Icono de la fuente de humo; se actualiza al cambiar el tipo */
  function sourceIcon(g, x, y) {
    var last = null;
    return function (type, active) {
      var key = type + (active ? 1 : 0);
      if (key === last) return;
      last = key;
      while (g.firstChild) g.removeChild(g.firstChild);
      g.setAttribute("transform", "translate(" + x + " " + y + ")");
      g.setAttribute("opacity", active ? "1" : "0.35");
      if (type === "llama") {
        g.appendChild(s("path", { class: "flame", d: "M0 0 C-14 -10 -6 -24 0 -36 C4 -26 16 -18 10 -4 C8 0 4 2 0 0z" }));
        g.appendChild(s("path", { class: "flame-in", d: "M0 -2 C-6 -8 -2 -16 1 -22 C3 -16 8 -10 5 -3z" }));
      } else if (type === "lenta") {
        g.appendChild(s("rect", { x: -16, y: -8, width: 32, height: 10, rx: 3, fill: "#5a2a1a" }));
        g.appendChild(s("circle", { cx: -6, cy: -5, r: 2.5, fill: "#ff6a1a" }));
        g.appendChild(s("circle", { cx: 6, cy: -4, r: 2, fill: "#ff6a1a" }));
      } else {
        g.appendChild(s("rect", { x: -16, y: -14, width: 32, height: 16, rx: 3, class: "fl" }));
        g.appendChild(s("rect", { x: -20, y: -18, width: 40, height: 5, rx: 2, class: "fl" }));
      }
      g.appendChild(text(0, 18, TYPES[type].label.split(" (")[0], "lbl", "middle"));
    };
  }

  /* =========================================================
     1. ÓPTICO (luz dispersa / oscurecimiento)
     ========================================================= */
  function optical(svg, ctl, opts) {
    opts = opts || {};
    var C = { x: 380, y: 160 }, R = 120;
    var room = s("g");
    room.appendChild(text(16, 26, "Aire del local", "lbl-strong"));
    room.appendChild(s("path", { d: "M16 300 h70 m-10 -6 l10 6 -10 6", class: "st" }));
    room.appendChild(text(16, 290, "el humo entra con el aire"));
    svg.appendChild(room);

    svg.appendChild(s("circle", { cx: C.x, cy: C.y, r: R + 12, class: "st", "stroke-dasharray": "2 5" }));
    svg.appendChild(text(C.x, C.y - R - 18, "carcasa con malla antiinsectos", "lbl", "middle"));
    svg.appendChild(s("circle", { cx: C.x, cy: C.y, r: R, class: "fl" }));
    var teeth = s("g");
    for (var i = 0; i < 16; i++) {
      var a = i * 360 / 16 + 11;
      teeth.appendChild(s("rect", { class: "dk", x: -22, y: -3, width: 22, height: 6, rx: 1, transform: "rotate(" + a + " " + C.x + " " + C.y + ") translate(" + (C.x + R - 2) + " " + C.y + ") rotate(32)" }));
    }
    svg.appendChild(teeth);
    if (!opts.compact) svg.appendChild(text(C.x + R + 16, C.y - 70, "laberinto", "lbl"));

    var beam = s("line", { x1: 302, y1: C.y, x2: 452, y2: C.y, class: "beam" });
    svg.appendChild(beam);
    var rays = s("g");
    svg.appendChild(rays);
    var rayEls = [];
    for (var r = 0; r < 10; r++) { var l = s("line", { class: "ray", opacity: 0 }); rays.appendChild(l); rayEls.push(l); }

    var smokeLayer = s("g");
    svg.appendChild(smokeLayer);
    var smoke = new Smoke(smokeLayer, 150);

    svg.appendChild(s("rect", { x: 280, y: C.y - 9, width: 22, height: 18, rx: 3, class: "dk" }));
    svg.appendChild(s("circle", { cx: 300, cy: C.y, r: 4, class: "glow" }));
    svg.appendChild(text(272, C.y - 16, "LED emisor", "lbl-strong", "start"));

    var trap = s("g", null, [
      s("path", { d: "M452 " + (C.y - 16) + " L476 " + C.y + " L452 " + (C.y + 16) + "z", class: "dk" }),
      text(486, C.y + 4, "trampa", "lbl-strong", "start")
    ]);
    svg.appendChild(trap);

    var pd = s("g");
    var pdGlow = s("circle", { cx: 0, cy: 0, r: 0, class: "glow", opacity: 0.35 });
    pd.appendChild(pdGlow);
    pd.appendChild(s("rect", { x: -12, y: -8, width: 24, height: 16, rx: 3, class: "dk" }));
    var pdLabel = text(0, 30, "fotodiodo", "lbl-strong", "middle");
    pd.appendChild(pdLabel);
    svg.appendChild(pd);

    var conc = 0, delay = new DelayLine();
    var factorsKey = "factors";

    return {
      step: function (dt, t) {
        var obsc = ctl.mode === "obsc";
        var tech = APP.techById(opts.techId || "optico");
        var factors = obsc ? tech.obscFactors : tech.factors;
        var PD = obsc ? { x: 462, y: C.y } : { x: C.x, y: C.y + 92 };
        pd.setAttribute("transform", "translate(" + PD.x + " " + PD.y + ")");
        pdLabel.setAttribute("y", obsc ? -16 : 30);
        trap.setAttribute("display", obsc ? "none" : "inline");

        var rate = ctl.density / 100 * 16;
        smoke.emit(rate, dt, function () { return particle(ctl, rand(-5, 40), rand(40, 285), rand(50, 70), rand(-8, 8), 16); });
        smoke.update(dt, function (p, dt) {
          var dx = p.x - C.x, dy = p.y - C.y, inside = dx * dx + dy * dy < (R - 6) * (R - 6);
          if (inside) {
            p.vx = ema(p.vx, 30, dt, 0.6);
            p.vy += noise(80) * dt;
            p.vy = clamp(p.vy, -18, 18);
          }
          p.x += p.vx * dt; p.y += p.vy * dt;
        });

        conc = ema(conc, delay.get(t, 3), dt, 1.4);
        var detect = clamp(conc + noise(1.2), 0, 100);

        var k = 0;
        if (!obsc) {
          for (var i = 0; i < smoke.list.length && k < rayEls.length; i++) {
            var p = smoke.list[i];
            if (Math.abs(p.y - C.y) < 14 && p.x > 305 && p.x < 450) {
              var el = rayEls[k++];
              el.setAttribute("x1", p.x.toFixed(1)); el.setAttribute("y1", p.y.toFixed(1));
              el.setAttribute("x2", PD.x); el.setAttribute("y2", PD.y - 8);
              el.setAttribute("opacity", "0.75");
            }
          }
        }
        for (; k < rayEls.length; k++) rayEls[k].setAttribute("opacity", 0);

        if (obsc) {
          beam.setAttribute("x2", 452);
          beam.setAttribute("opacity", (0.55 * (1 - detect / 120)).toFixed(2));
          pdGlow.setAttribute("r", (6 + 16 * (1 - detect / 100)).toFixed(1));
          return { detect: detect, value: 100 - detect, invert: true, label: "Luz que llega al receptor" };
        }
        beam.setAttribute("opacity", "0.5");
        pdGlow.setAttribute("r", (detect / 100 * 22).toFixed(1));
        return { detect: detect, value: detect, invert: false, label: "Luz dispersada que llega al fotodiodo" };
      },
      reset: function () { smoke.clear(); conc = 0; delay.reset(); }
    };
  }

  /* =========================================================
     2. IÓNICO
     ========================================================= */
  function ionic(svg, ctl) {

      s("rect", { x: 0, y: 0, width: 26, height: 20, rx: 3, class: "dk" }),
      s("polygon", { points: "13,3 22,17 4,17", fill: "#f5c400" })
    ]);
    svg.appendChild(src);
    svg.appendChild(text(X0 + 2, YB + 44, "fuente Am-241 sellada", "lbl"));
    var alpha = s("g");
    for (var a = 0; a < 6; a++) {
      alpha.appendChild(s("line", { class: "alpha", x1: X0 + 36, y1: YB - 14, x2: X0 + 36 + 60 * Math.cos(-a * 0.25), y2: YB - 14 + 60 * Math.sin(-a * 0.25) }));
    }

    svg.appendChild(s("path", { d: "M" + X1 + " " + (YT - 5) + " H 560 V 300 H " + M.x + " V " + (M.y + 34), class: "st" }));
        svg.appendChild(s("circle", { cx: M.x, cy: M.y, r: 34, class: "fl" }));
    svg.appendChild(s("path", { d: "M" + (M.x - 24) + " " + (M.y + 6) + " A 26 26 0 0 1 " + (M.x + 24) + " " + (M.y + 6), class: "st" }));
    var needle = s("line", { x1: M.x, y1: M.y + 10, x2: M.x, y2: M.y - 20, stroke: "var(--bad)", "stroke-width": 2.5 });
    svg.appendChild(needle);
    svg.appendChild(text(M.x, M.y + 26, "corriente", "lbl", "middle"));
    svg.appendChild(s("path", { d: "M" + (M.x + 34) + " " + M.y + " H 200 V " + (YB + 5) + " H " + X0, class: "st" }));

    var ionLayer = s("g"), smokeLayer = s("g");
    svg.appendChild(ionLayer); svg.appendChild(smokeLayer);
    var ions = [];
    for (var i = 0; i < 46; i++) {
      var pos = i % 2 === 0;
      var el = s("circle", { r: 3, class: pos ? "ion-pos" : "ion-neg" });
      ionLayer.appendChild(el);
      ions.push({ x: rand(X0 + 10, X1 - 10), y: rand(YT + 6, YB - 6), pos: pos, el: el, stuck: false });
    }
    var smoke = new Smoke(smokeLayer, 140);
    var conc = 0, delay = new DelayLine();

    return {
      step: function (dt, t) {
        smoke.emit(ctl.density / 100 * 14, dt, function () { return particle(ctl, rand(-5, 40), rand(70, 250), rand(50, 70), rand(-6, 6), 15); });
        smoke.update(dt, function (p, dt) {
          if (p.x > X0 && p.x < X1) { p.vx = ema(p.vx, 26, dt, 0.5); p.vy = clamp(p.vy + noise(60) * dt, -15, 15); }
          p.x += p.vx * dt; p.y += p.vy * dt;
          if (p.y < YT + 4) p.vy = Math.abs(p.vy);
          if (p.y > YB - 4 && p.x > X0 && p.x < X1) p.vy = -Math.abs(p.vy);
        });

        delay.push(t, ctl.density * (APP.techById("ionico").factors[ctl.type] || 0));
        conc = ema(conc, delay.get(t, 3), dt, 1.4);
        var detect = clamp(conc + noise(1.2), 0, 100);
        var current = 100 - detect;

        var stuckTarget = Math.round(ions.length * detect / 110);
        var stuckNow = ions.filter(function (o) { return o.stuck; }).length;
        ions.forEach(function (o) {
          if (stuckNow < stuckTarget && !o.stuck && Math.random() < 0.08) { o.stuck = true; stuckNow++; }
          else if (stuckNow > stuckTarget && o.stuck && Math.random() < 0.08) { o.stuck = false; stuckNow--; }
          if (o.stuck) {
            o.x += 12 * dt; o.y += noise(10) * dt;
            if (o.x > X1 - 6) o.x = X0 + 8;
            o.el.setAttribute("class", "ion-stuck");
          } else {
            o.y += (o.pos ? 70 : -70) * dt;
            if (o.y > YB - 4 || o.y < YT + 4) { o.y = rand(YT + 10, YB - 10); o.x = rand(X0 + 10, X1 - 10); }
            o.el.setAttribute("class", o.pos ? "ion-pos" : "ion-neg");
          }
          o.el.setAttribute("cx", o.x.toFixed(1)); o.el.setAttribute("cy", o.y.toFixed(1));
        });
        var ang = (-60 + current / 100 * 120) * Math.PI / 180;
        needle.setAttribute("x2", (M.x + 28 * Math.sin(ang)).toFixed(1));
        needle.setAttribute("y2", (M.y + 10 - 28 * Math.cos(ang)).toFixed(1));
        return { detect: detect, value: current, invert: true, label: "Corriente de ionización" };
      },
      reset: function () { smoke.clear(); conc = 0; delay.reset(); ions.forEach(function (o) { o.stuck = false; }); }
    };
  }

  /* =========================================================
     3. HAZ ÓPTICO (gran espacio)
     ========================================================= */
  function beamScene(svg, ctl) {
    var BY = 62, FX = 300, FY = 296;
    svg.appendChild(s("rect", { x: 0, y: 0, width: 600, height: 22, class: "fl" }));
    svg.appendChild(text(300, 15, "techo alto", "lbl", "middle"));
    svg.appendChild(s("rect", { x: 0, y: 22, width: 18, height: 298, class: "fl" }));
    svg.appendChild(s("rect", { x: 582, y: 22, width: 18, height: 298, class: "fl" }));
    svg.appendChild(s("line", { x1: 18, y1: 300, x2: 582, y2: 300, class: "st" }));
    svg.appendChild(s("rect", { x: 18, y: BY - 16, width: 42, height: 32, rx: 4, class: "fl" }));
    svg.appendChild(text(24, BY + 34, "emisor/receptor", "lbl"));
    svg.appendChild(s("rect", { x: 566, y: BY - 18, width: 16, height: 36, class: "dk" }));
    svg.appendChild(text(578, BY + 34, "reflector", "lbl", "end"));
    var beamOut = s("line", { x1: 60, y1: BY - 4, x2: 566, y2: BY - 4, class: "beam" });
    var beamBack = s("line", { x1: 566, y1: BY + 4, x2: 60, y2: BY + 4, class: "beam" });
    svg.appendChild(beamOut); svg.appendChild(beamBack);

    var stratLine = s("g", { display: "none" }, [
      s("line", { x1: 18, y1: 160, x2: 582, y2: 160, class: "strat" }),
      text(30, 152, "capa de estratificación (el humo se enfría y deja de subir)", "lbl")
    ]);
    svg.appendChild(stratLine);

    var smokeLayer = s("g");
    svg.appendChild(smokeLayer);
    var smoke = new Smoke(smokeLayer, 170);
    var src = s("g"); svg.appendChild(src);
    var drawSrc = sourceIcon(src, FX, FY);

    var block = s("g", { transform: "translate(420 300)" }, [
      s("rect", { x: -26, y: -40, width: 52, height: 40, rx: 2, fill: "#b07a3a", stroke: "var(--svg-stroke)", "stroke-width": 2 }),
      text(0, -46, "palé elevado", "lbl", "middle")
    ]);
    svg.appendChild(block);
    var blockY = 300;

    var conc = 0, delay = new DelayLine();
    return {
      step: function (dt, t) {
        var rate = ctl.density / 100 * 18;
        drawSrc(ctl.type, ctl.density > 0);
        smoke.emit(rate, dt, function () { return particle(ctl, FX + rand(-8, 8), FY - 30, rand(-6, 6), rand(-62, -48), 18); });
        smoke.update(dt, function (p, dt) {
          var ceiling = ctl.strat ? 160 : 34;
          if (p.y <= ceiling + 6) {
            p.vy = ema(p.vy, 0, dt, 0.4);
            if (Math.abs(p.vx) < 15) p.vx = (p.x < FX ? -1 : 1) * rand(25, 45);
          } else {
            p.vx += noise(30) * dt;
          }
          p.x += p.vx * dt; p.y += p.vy * dt;
          if (p.x < 22 || p.x > 578) p.vx = -p.vx;
          if (p.y < ceiling) p.y = ceiling;
        });
        var targetBlockY = ctl.blocked ? BY + 40 : 300;
        blockY = ema(blockY, targetBlockY, dt, 0.35);
        block.setAttribute("transform", "translate(420 " + blockY.toFixed(1) + ")");
        stratLine.setAttribute("display", ctl.strat ? "inline" : "none");

        var reach = ctl.strat ? 0.04 : 1;
        delay.push(t, ctl.density * (APP.techById("haz").factors[ctl.type] || 0) * reach);
        conc = ema(conc, delay.get(t, 4.5), dt, 1.8);
        var detect = clamp(conc + noise(1), 0, 100);
        var fullyBlocked = blockY < BY + 44;
        var received = fullyBlocked ? 2 : 100 - detect;
        var opBack = fullyBlocked ? 0 : 0.5 * received / 100;
        beamOut.setAttribute("x2", fullyBlocked ? 394 : 566);
        beamBack.setAttribute("opacity", opBack.toFixed(2));
        beamOut.setAttribute("opacity", (0.25 + 0.3 * received / 100).toFixed(2));
        return { detect: fullyBlocked ? 0 : detect, value: received, invert: true, fault: fullyBlocked, label: "Señal recibida del haz" };
      },
      reset: function () { smoke.clear(); conc = 0; delay.reset(); }
    };
  }

  /* =========================================================
     4. ASPIRACIÓN
     ========================================================= */
  function aspirating(svg, ctl) {
    var PY = 62, PX0 = 110, PX1 = 572, FX = 430, FY = 296;
    var holes = [200, 290, 380, 470, 560];
    svg.appendChild(s("rect", { x: 0, y: 0, width: 600, height: 30, class: "fl" }));
    svg.appendChild(text(300, 19, "techo de la sala protegida", "lbl", "middle"));
    svg.appendChild(s("line", { x1: 0, y1: 300, x2: 600, y2: 300, class: "st" }));
    svg.appendChild(s("path", { d: "M" + PX0 + " 150 V " + PY + " H " + PX1, class: "pipe" }));
    svg.appendChild(s("path", { d: "M" + PX0 + " 150 V " + PY + " H " + PX1, class: "pipe-in" }));
    holes.forEach(function (x) { svg.appendChild(s("circle", { cx: x, cy: PY + 5, r: 3, fill: "var(--svg-dark)" })); });
    svg.appendChild(text(240, PY + 26, "tubo de muestreo con orificios", "lbl"));

    /* Unidad */
    svg.appendChild(s("rect", { x: 40, y: 150, width: 140, height: 140, rx: 8, class: "fl" }));
    svg.appendChild(text(110, 314, "unidad de detección", "lbl", "middle"));
    svg.appendChild(s("rect", { x: 96, y: 160, width: 28, height: 10, class: "dk" }));
    svg.appendChild(text(130, 169, "filtro", "lbl"));
    var chamber = s("rect", { x: 70, y: 186, width: 80, height: 44, rx: 4, class: "dk" });
    svg.appendChild(chamber);
    var laser = s("line", { x1: 72, y1: 208, x2: 148, y2: 208, class: "ray", opacity: 0.8 });
    svg.appendChild(laser);
    svg.appendChild(text(110, 244, "cámara láser", "lbl", "middle"));
    var fan = s("g", { transform: "translate(110 266)" }, [
      s("circle", { r: 14, class: "st" }),
      s("path", { d: "M0 0 L0 -12 A12 12 0 0 1 10 -6z M0 0 L10 6 A12 12 0 0 1 -2 12z M0 0 L-10 6 A12 12 0 0 1 -10 -6z", fill: "var(--svg-stroke)" })
    ]);
    svg.appendChild(fan);
    svg.appendChild(text(132, 270, "aspirador", "lbl"));

    var flowLayer = s("g");
    svg.appendChild(flowLayer);
    var flows = [];
    for (var f = 0; f < 10; f++) { var fe = s("circle", { r: 2.2, class: "flow" }); flowLayer.appendChild(fe); flows.push({ d: f * 50, el: fe }); }

    var smokeLayer = s("g");
    svg.appendChild(smokeLayer);
    var smoke = new Smoke(smokeLayer, 170);
    var src = s("g"); svg.appendChild(src);
    var drawSrc = sourceIcon(src, FX, FY);

    /* Recorrido del tubo: H desde x hasta PX0 y bajada hasta la cámara */
    var LEN_V = 208 - PY;
    function pipePoint(d) {
      var lenH = PX1 - PX0;
      if (d < lenH) return { x: PX1 - d, y: PY };
      return { x: PX0, y: PY + Math.min(d - lenH, LEN_V) };
    }

    var conc = 0, delay = new DelayLine(), rot = 0;
    var started = null, measured = null, lastDensity = 0;
    var SPEED = 80;

    return {
      step: function (dt, t) {
        drawSrc(ctl.type, ctl.density > 0);
        smoke.emit(ctl.density / 100 * 16, dt, function () { return particle(ctl, FX + rand(-10, 10), FY - 28, rand(-6, 6), rand(-60, -48), 20); });
        smoke.update(dt, function (p, dt) {
          if (p.inPipe) {
            p.d += SPEED * dt;
            var q = pipePoint(p.d);
            p.x = q.x; p.y = q.y;
            if (p.d > (PX1 - PX0) + LEN_V) { p.life = Math.min(p.life, p.age + 0.6); }
            return true;
          }
          if (p.y < PY + 14) {
            for (var i = 0; i < holes.length; i++) {
              if (Math.abs(p.x - holes[i]) < 16 && Math.random() < 0.5) {
                p.inPipe = true; p.d = PX1 - holes[i]; p.alpha = 0.9; p.life = p.age + 12;
                return true;
              }
            }
            p.vy = ema(p.vy, 0, dt, 0.3);
            if (Math.abs(p.vx) < 12) p.vx = (Math.random() < 0.5 ? -1 : 1) * rand(18, 34);
          } else {
            p.vx += noise(24) * dt;
          }
          p.x += p.vx * dt; p.y += p.vy * dt;
          if (p.y < PY + 8) p.y = PY + 8;
        });

        rot = (rot + 400 * dt) % 360;
        fan.setAttribute("transform", "translate(110 266) rotate(" + rot.toFixed(0) + ")");
        flows.forEach(function (o) {
          o.d = (o.d + SPEED * dt) % ((PX1 - PX0) + LEN_V);
          var q = pipePoint(o.d);
          o.el.setAttribute("cx", q.x); o.el.setAttribute("cy", q.y);
        });

        /* Retardo = subida del humo + recorrido del tubo hasta la cámara (modelo didáctico) */
        var transport = ((PX1 - FX) < 0 ? 0 : (PX1 - FX)) / SPEED + LEN_V / SPEED + (FY - PY) / 55;
        delay.push(t, ctl.density * (APP.techById("aspiracion").factors[ctl.type] || 0) * 1.35);
        conc = ema(conc, delay.get(t, transport), dt, 1);
        var detect = clamp(conc + noise(1), 0, 100);
        laser.setAttribute("stroke-width", (2 + detect / 25).toFixed(1));

        if (lastDensity === 0 && ctl.density > 0) { started = t; measured = null; }
        if (ctl.density === 0) started = null;
        if (started !== null && measured === null && detect > 6) measured = t - started;
        lastDensity = ctl.density;

        return {
          detect: detect, value: detect, invert: false, label: "Partículas en la cámara",
          extra: measured !== null ? "Retardo observado en esta simulación: " + measured.toFixed(1) + " s" : (started !== null ? "Midiendo el retardo de transporte…" : "Sube el humo desde 0 para medir el retardo"),
          measured: measured
        };
      },
      reset: function () { smoke.clear(); conc = 0; delay.reset(); started = null; measured = null; lastDensity = 0; }
    };
  }

  /* =========================================================
     5. MULTISENSOR
     ========================================================= */
  function multisensor(svg, ctl) {
    var inner = s("g");
    svg.appendChild(inner);
    var opt = optical(inner, ctl, { techId: "multisensor", compact: true });
    var TX = 540, TY = 150;
    svg.appendChild(s("rect", { x: TX - 9, y: TY - 70, width: 18, height: 110, rx: 9, class: "fl" }));
    var mercury = s("rect", { x: TX - 5, y: TY + 30, width: 10, height: 0, fill: "var(--warn)" });
    svg.appendChild(mercury);
    svg.appendChild(s("circle", { cx: TX, cy: TY + 46, r: 12, fill: "var(--warn)" }));
    svg.appendChild(text(TX, TY + 76, "termistor", "lbl-strong", "middle"));
    var waves = s("g", { opacity: 0 });
    [0, 1, 2].forEach(function (i) { waves.appendChild(s("path", { class: "heat-wave", d: "M" + (TX - 30 + i * 12) + " 300 q 6 -10 0 -20 q -6 -10 0 -20" })); });
    svg.appendChild(waves);
    var heat = 0, hDelay = new DelayLine();

    return {
      step: function (dt, t) {
        var o = opt.step(dt, t);
        hDelay.push(t, ctl.density * TYPES[ctl.type].heat);
        heat = ema(heat, hDelay.get(t, 2.5), dt, 3);
        var hv = clamp(heat, 0, 100);
        mercury.setAttribute("y", (TY + 30 - hv).toFixed(1));
        mercury.setAttribute("height", hv.toFixed(1));
        waves.setAttribute("opacity", (hv / 100).toFixed(2));
        return { detect: o.detect, value: o.detect, invert: false, label: "Señal de humo (cámara óptica)", heat: hv };
      },
      reset: function () { opt.reset(); heat = 0; hDelay.reset(); }
    };
  }

  /* =========================================================
     6. TÉRMICO (comparación)
     ========================================================= */
  function thermal(svg, ctl) {
    var FX = 300, FY = 296;
    svg.appendChild(s("rect", { x: 0, y: 0, width: 600, height: 26, class: "fl" }));
    svg.appendChild(s("line", { x1: 0, y1: 300, x2: 600, y2: 300, class: "st" }));
    svg.appendChild(s("path", { d: "M260 26 h80 v10 q0 22 -40 22 q-40 0 -40 -22z", class: "fl" }));
    var bulb = s("circle", { cx: 300, cy: 66, r: 8, fill: "var(--warn)" });
    svg.appendChild(bulb);
    svg.appendChild(text(352, 52, "termistor (no tiene cámara de humo)", "lbl"));
    var ignored = text(300, 120, "", "lbl-strong", "middle");
    svg.appendChild(ignored);
    var waves = s("g", { opacity: 0 });
    for (var i = 0; i < 5; i++) waves.appendChild(s("path", { class: "heat-wave", d: "M" + (270 + i * 15) + " 270 q 8 -14 0 -28 q -8 -14 0 -28 q 8 -14 0 -28" }));
    svg.appendChild(waves);
    var smokeLayer = s("g");
    svg.appendChild(smokeLayer);
    var smoke = new Smoke(smokeLayer, 150);
    var src = s("g"); svg.appendChild(src);
    var drawSrc = sourceIcon(src, FX, FY);
    var heat = 0, delay = new DelayLine(), wv = 0;

    return {
      step: function (dt, t) {
        drawSrc(ctl.type, ctl.density > 0);
        smoke.emit(ctl.density / 100 * 14, dt, function () { return particle(ctl, FX + rand(-8, 8), FY - 28, rand(-6, 6), rand(-55, -45), 14); });
        smoke.update(dt, function (p, dt) {
          if (p.y < 80) { p.vy = ema(p.vy, 0, dt, 0.4); if (Math.abs(p.vx) < 15) p.vx = (p.x < FX ? -1 : 1) * rand(25, 40); }
          else p.vx += noise(30) * dt;
          p.x += p.vx * dt; p.y += p.vy * dt;
        });
        delay.push(t, ctl.density * (APP.techById("termico").factors[ctl.type] || 0));
        heat = ema(heat, delay.get(t, 3), dt, 3.5);
        var hv = clamp(heat + noise(0.8), 0, 100);
        wv = (wv + dt * 30) % 28;
        waves.setAttribute("opacity", (hv / 100).toFixed(2));
        waves.setAttribute("transform", "translate(0 " + (-wv).toFixed(1) + ")");
        ignored.textContent = ctl.density > 20 && hv < 20 ? "Hay humo, pero el sensor solo mide temperatura" : "";
        bulb.setAttribute("r", (8 + hv / 25).toFixed(1));
        return { detect: hv, value: hv, invert: false, label: "Subida de temperatura (escala didáctica)" };
      },
      reset: function () { smoke.clear(); heat = 0; delay.reset(); }
    };
  }

  APP.scenes = { optico: optical, ionico: ionic, haz: beamScene, aspiracion: aspirating, multisensor: multisensor, termico: thermal };
})();
